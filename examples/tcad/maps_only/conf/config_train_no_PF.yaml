# Model architecture
model:
  # Number of GALE transformer blocks
  n_layers: 4
  # Hidden dimension of the transformer blocks
  n_hidden: 160
  # Number of attention heads (must divide n_hidden evenly)
  n_head: 4
  # Number of learnable physics-slice tokens per block
  slice_num: 32
  # FFN expansion ratio inside each block
  mlp_ratio: 4
  # Transolver++ features (Gumbel-softmax slicing, per-point temperature)
  plus: false
  # Output dim of each SinusoidalTimestepEmbedding (one for t, one for dt);
  # the per-block AdaLN MLP consumes 2*time_embed_channels after concat.
  time_embed_channels: 64
  # torch.compile(model) before DDP wrap. Disable for debugging.
  compile: true

# Dataset
dataset:
  # Path to the maps_only/data/ directory. Override at CLI.
  data_dir: ???
  # Path to stats.json produced by compute_stats.py. Override at CLI.
  stats_file: ???
  # Number of consecutive timesteps per sample: current (n) and target (n+1).
  # Pure teacher-forcing only needs 2.
  n_steps: 2

# Training schedule (sample-based)
training:
  batch_size_per_gpu: 8
  lr: 5.0e-3
  weight_decay: 1.0e-4
  # Total samples to see before stopping
  max_training_samples: 5000000
  # PyTorch DataLoader workers
  num_workers: 4
  # Learning-rate scheduler. Set to null to disable (constant lr) or
  # "cosine_annealing" to use CosineAnnealingLR with the parameters below.
  scheduler:
    name: cosine_annealing
    eta_min: 5.0e-4

# I/O and logging (PythonLogger only)
io:
  checkpoint_dir: "./checkpoints/"
  load_checkpoint: false
  # Log every N samples
  logging_frequency: 10000
  # Save checkpoint every N samples
  checkpoint_frequency: 200000

# Reproducibility
seed: 1234
