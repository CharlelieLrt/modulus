# Model architecture
model:
  # Number of GALE transformer blocks
  n_layers: 4
  # Hidden dimension of the transformer blocks
  n_hidden: 256
  # Number of attention heads (must divide n_hidden evenly)
  n_head: 4
  # Number of learnable physics-slice tokens per block
  slice_num: 32
  # FFN expansion ratio inside each block
  mlp_ratio: 4
  # Transolver++ features (Gumbel-softmax slicing, per-point temperature)
  plus: false
  # PositionalEmbedding output dim, shared by the time and thickness
  # embeddings. Global-context input has width 2 * embed_channels (concat of
  # the two); the per-block AdaLN MLP consumes embed_channels (time only).
  embed_channels: 64
  # Euler residual head: returns x_t[..., :out_dim] + dt * f(x_t, t, ...).
  # Set False ONLY for an ablation run; with the residual head off the model
  # returns the raw f and the loss magnitude becomes incomparable.
  use_residual_head: true
  # torch.compile(model) before DDP wrap. Disable for debugging.
  compile: true

# Dataset
dataset:
  # Path to the maps_only/data/ directory. Override at CLI.
  data_dir: ???
  # Path to stats.json produced by compute_stats.py. Override at CLI.
  stats_file: ???
  # Number of consecutive timesteps in each sample window. The push-forward
  # trick needs 3: current (n), next1 (n+1), next2 (n+2).
  n_steps: 3
  # Restrict training to a single thickness ("2nm" / "3nm" / "4nm"). Use null
  # to train across every available thickness. Pair with the matching
  # stats_*.json (e.g. stats_2nm.json) when set.
  thickness: null
  # Importance-weighted sampling. enabled=false uses the uniform
  # InfiniteSampler (default, unchanged behavior). enabled=true switches
  # to a 2-tier weighted sampler driven by the standardized starting
  # state of each sample: weight_i = max_n |T_n - T_mean|/T_std
  #                              + max_n |V_n - V_mean|/V_std,
  # evaluated at the sample's first timestep. Samples are then ranked by
  # weight and split into a top tier (the top `weight_percentile` of
  # ranks) and a bottom tier (the rest). Each tier is sampled uniformly
  # internally; the top tier collectively integrates to
  # `sampling_probability` of the draw mass, and the bottom tier
  # integrates to (1 - sampling_probability).
  #
  # Sanity checks for the (weight_percentile, sampling_probability) pair:
  #   sampling_probability == weight_percentile  -> uniform sampling
  #   sampling_probability >  weight_percentile  -> top tier over-sampled
  #   sampling_probability <  weight_percentile  -> top tier under-sampled
  # We require sampling_probability >= weight_percentile.
  weighted_sampling:
    enabled: false
    weight_percentile: 0.2
    sampling_probability: 0.5

# Training schedule (sample-based)
training:
  batch_size_per_gpu: 8
  lr: 4.0e-3
  weight_decay: 1.0e-4
  # Total samples to see before stopping
  max_training_samples: 5000000
  # PyTorch DataLoader workers
  num_workers: 4
  # Learning-rate scheduler. Set to null to disable (constant lr) or
  # "cosine_annealing" to use CosineAnnealingLR with the parameters below.
  scheduler:
    name: cosine_annealing
    eta_min: 5.0e-4
  # Push-forward trick. teacher_forcing_fraction follows a tanh schedule:
  # at samples_trained == annealing_samples, it has traversed 95% of the way
  # from initial_fraction to final_fraction.
  push_forward:
    initial_fraction: 1.0
    final_fraction: 0.05
    annealing_samples: 1250000

# I/O and logging (PythonLogger only)
io:
  checkpoint_dir: "./checkpoints/"
  load_checkpoint: false
  # Log every N samples
  logging_frequency: 10000
  # Save checkpoint every N samples
  checkpoint_frequency: 200000

# Reproducibility
seed: 1234
